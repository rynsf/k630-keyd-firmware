# Exercises every action the firmware engine supports that keymap/rynsf.conf does not
# (overloadt, overload + overload_tap_timeout, toggle, clear, oneshot on a normal layer,
# no oneshot timeout), so a future config edit cannot reach untested engine code.
[ids]
*

include layouts/colemak

[global]
overload_tap_timeout = 150

[main]
capslock = overloadt(nav, esc, 200)
enter = overload(sym, enter)
space = overloadt2(nav, space, 175)
tab = toggle(nav)
leftshift = oneshot(shift)
rightshift = oneshot(sym)
esc = clear()
leftalt = layer(meta)
leftmeta = layer(alt)
rightalt = layer(control)
rightcontrol = overloadt(sym, rightcontrol, 120)
1 = setlayout(colemak)
2 = setlayout(main)

[nav]
j = left
k = down
l = up
; = right
a = leftshift
s = layer(sym)
d = oneshot(control)
f = backspace
q = toggle(sym)
w = clear()

[sym]
a = !
s = @
d = #
f = $
j = (
k = )
l = _
; = +
q = overloadt2(nav, tab, 100)
